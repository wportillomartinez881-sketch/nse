<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Servicios Empresariales</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- PANTALLA DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <div id="authScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 overflow-y-auto">
        <div class="auth-card w-full max-w-md p-8 rounded-2xl shadow-2xl border border-slate-700 my-8">
            
            <!-- LOGO / ENCABEZADO -->
            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-600 text-white mb-3 shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-chart-line text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-wide">NEXUS</h1>
                <p class="text-xs text-indigo-600 font-semibold uppercase tracking-wider">Servicios Empresariales S.A. de C.V.</p>
            </div>

            <!-- FORMULARIO: INICIAR SESIÓN -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <h2 class="text-lg font-semibold text-slate-700 text-center mb-2">Iniciar Sesión</h2>
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" required placeholder="empresa@nexus.com" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition duration-200">
                    Ingresar al Sistema
                </button>

                <div class="pt-4 border-t border-slate-200 text-center">
                    <p class="text-xs text-slate-600">¿No tienes una empresa registrada?</p>
                    <button type="button" onclick="toggleAuthMode('register')" class="mt-1 text-sm text-indigo-600 hover:text-indigo-800 font-semibold underline">
                        Registrar Empresa
                    </button>
                </div>
            </form>

            <!-- FORMULARIO: REGISTRAR EMPRESA -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <h2 class="text-lg font-semibold text-slate-700 text-center mb-2">Registrar Nueva Empresa</h2>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre de la Empresa</label>
                    <input type="text" required placeholder="Ej. Mi Empresa S.A. de C.V." class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo del Administrador</label>
                    <input type="email" required placeholder="admin@empresa.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
                    <input type="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm outline-none">
                </div>

                <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition duration-200">
                    Crear Cuenta y Acceder
                </button>

                <div class="pt-4 border-t border-slate-200 text-center">
                    <p class="text-xs text-slate-600">¿Ya tienes una cuenta?</p>
                    <button type="button" onclick="toggleAuthMode('login')" class="mt-1 text-sm text-indigo-600 hover:text-indigo-800 font-semibold underline">
                        Volver al Inicio de Sesión
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- PANEL PRINCIPAL (DASHBOARD - OCULTO INICIALMENTE) -->
    <div id="mainApp" class="hidden flex-1 flex flex-col min-h-screen bg-slate-100">
        <!-- BARRA SUPERIOR DE NAVEGACIÓN -->
        <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold">
                    N
                </div>
                <div>
                    <h2 class="text-base font-bold text-slate-800">NEXUS Servicios Empresariales</h2>
                    <p class="text-xs text-slate-500" id="userCompanyDisplay">Panel General</p>
                </div>
            </div>
            <button onclick="handleLogout()" class="px-4 py-2 text-xs font-medium text-slate-600 hover:text-red-600 hover:bg-red-50 rounded-lg border border-slate-200 transition">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Cerrar Sesión
            </button>
        </header>

        <!-- CONTENIDO DEL PANEL -->
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
                <h3 class="text-lg font-bold text-slate-800 mb-2">Bienvenido al Sistema</h3>
                <p class="text-sm text-slate-600">Has ingresado correctamente al panel de administración empresarial.</p>
            </div>
        </main>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // Alternar entre el formulario de Login y Registro
        function toggleAuthMode(mode) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (mode === 'register') {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
            } else {
                registerForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
            }
        }

        // Simulación de Inicio de Sesión
        function handleLogin(event) {
            event.preventDefault();
            enterApp('Empresa Registrada');
        }

        // Simulación de Registro de Empresa
        function handleRegister(event) {
            event.preventDefault();
            enterApp('Nueva Empresa S.A.');
        }

        // Función para ingresar a la aplicación
        function enterApp(companyName) {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userCompanyDisplay').innerText = companyName;
        }

        // Función para cerrar sesión
        function handleLogout() {
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
